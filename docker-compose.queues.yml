# Optional production scaling overlay. The base docker-compose.yml already
# starts one worker for every required queue. Use this only after measuring
# queue latency and available RAM:
#
#   docker compose -f docker-compose.yml -f docker-compose.queues.yml up -d

services:
    queue-default:
        deploy:
            replicas: 2

    queue-whatsapp:
        deploy:
            replicas: 3

    queue-broadcast:
        deploy:
            replicas: 2

    queue-ai:
        deploy:
            replicas: 2

    queue-social:
        deploy:
            replicas: 2

    queue-leads:
        deploy:
            replicas: 1

    queue-automation:
        deploy:
            replicas: 2

    queue-channel-health:
        deploy:
            replicas: 1
